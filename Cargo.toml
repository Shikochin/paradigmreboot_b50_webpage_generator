[package]
name = "paradigmreboot_b50_slide_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"  # 新增
chrono = "0.4"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
scraper = "0.18"
regex = "1.10"
indicatif = "0.17"
rayon = "1.8"
urlencoding = "2.1"

# Local web GUI dependencies
tiny_http = "0.12"
open = "3.2"