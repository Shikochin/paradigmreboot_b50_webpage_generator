[package]
name = "paradigmreboot_b50_slide_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"  # 新增
chrono = "0.4"
reqwest = { version = "0.11", features = ["blocking", "rustls-tls"] }
scraper = "0.18"
regex = "1.10"

# For headless Chrome screenshots (replaces Node puppeteer)
headless_chrome = "1.0"

# Local web GUI dependencies
tiny_http = { version = "0.12", optional = true }
open = { version = "3.2", optional = true }

[features]
# Enable local web GUI by building with `--features web-gui`
web-gui = ["tiny_http", "open"]